# Render Blueprint — Frontend (GoalForge UI)
# Deploy this repo ("frontend") as a Blueprint on Render.
# Docs: https://render.com/docs/blueprint-spec
#
# The API URL is baked into the bundle at build time via VITE_API_URL
# (see Dockerfile `ARG VITE_API_URL`). Set it to your deployed backend
# URL, e.g. https://goalforge-punl.onrender.com, as a build-time
# environment variable in the Render service settings.
# (Deploy the backend first, then copy its URL here and re-deploy.)

services:
  - type: web
    name: goalforge-ui
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
